<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<title>Мои финансы</title>
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --ink: #14201f; --muted: #6b7a78;
    --brand: #0f3d3e; --brand-2: #1c6b63; --line: #e2e8e6;
    --ok: #1d7a4f; --warn: #a86a00; --bad: #b3261e;
    --ok-bg: #e3f4ea; --warn-bg: #fdf1d8; --bad-bg: #fbe4e2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  #app { max-width: 640px; margin: 0 auto; min-height: 100%; padding: 16px 16px 100px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small-text { font-size: 13px; }
  .center { text-align: center; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: var(--ok); } .neg { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .hero { background: var(--brand); color: #fff; border-radius: 18px; padding: 22px 20px; margin-bottom: 16px; }
  .hero .muted { color: #b9d3cf; }
  .hero .big { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin: 2px 0 12px; }
  .hero .split { display: flex; gap: 12px; }
  .hero .split > div { flex: 1; background: rgba(255,255,255,.08); border-radius: 12px; padding: 10px 12px; }
  .hero .split b { display: block; font-size: 17px; }
  .hero .alt { font-size: 18px; font-weight: 600; color: #d6ebe7; margin: -8px 0 12px; }
  .hero .alt-s { font-size: 13px; color: #b9d3cf; margin-top: 2px; }
  .hero .rate-line { font-size: 12px; color: #b9d3cf; margin-top: 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 12px; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-2); outline-offset: 1px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .grid-amt { display: grid; grid-template-columns: 1fr 110px; gap: 0 10px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 12px 16px; background: var(--brand); color: #fff; font-weight: 600; }
  button.block { width: 100%; margin-top: 12px; }
  button.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  button.link { background: none; color: var(--brand-2); padding: 6px 0; font-weight: 500; }
  button.small { padding: 7px 12px; font-size: 14px; }
  button.add { padding: 6px 12px; font-size: 14px; border-radius: 999px; background: var(--ok-bg); color: var(--brand); }
  button.danger { background: var(--bad); }
  button.danger-ghost { background: transparent; color: var(--bad); border: 1px solid var(--bad-bg); }
  button:disabled { opacity: .55; cursor: default; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; min-width: 0; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .badge.active { background: var(--ok-bg); color: var(--ok); }
  .badge.pending { background: var(--warn-bg); color: var(--warn); }
  .badge.blocked { background: var(--bad-bg); color: var(--bad); }
  .badge.admin { background: var(--brand); color: #fff; }
  .err { background: var(--bad-bg); color: var(--bad); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-top: 12px; }
  .note { background: var(--ok-bg); color: var(--ok); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-top: 12px; }
  .warnbox { background: var(--warn-bg); color: var(--warn); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .item { padding: 12px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .tap { cursor: pointer; }
  .tap:active { background: var(--bg); }
  .item .amt { text-align: right; }
  .group-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 14px 0 2px; }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--bg); padding: 8px 10px; border-radius: 8px; word-break: break-all; }
  .bar { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: var(--brand-2); border-radius: 99px; }
  .banner { background: var(--warn-bg); color: #5c3b00; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
  .empty { text-align: center; padding: 14px 0 6px; color: var(--muted); font-size: 14px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav .inner { max-width: 640px; margin: 0 auto; display: flex; }
  nav button { flex: 1; background: none; color: var(--muted); border-radius: 0; padding: 12px 2px; font-weight: 500; font-size: 12px; line-height: 1.2; }
  nav button.on { color: var(--brand); font-weight: 700; box-shadow: inset 0 3px 0 var(--brand); }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 16px 0 4px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  #modal:empty { display: none; }
  .overlay { position: fixed; inset: 0; background: rgba(10, 25, 24, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .x { background: none; color: var(--muted); font-size: 22px; padding: 4px 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .seg { display: flex; background: #e7ecea; border-radius: 11px; padding: 3px; gap: 2px; margin-bottom: 12px; }
  .seg button { flex: 1; background: none; color: var(--muted); padding: 8px 4px; font-size: 14px; font-weight: 600; border-radius: 9px; }
  .seg button.on { background: #fff; color: var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(74px + env(safe-area-inset-bottom)); border-radius: 999px; padding: 14px 20px; box-shadow: 0 6px 18px rgba(15,61,62,.35); z-index: 6; font-size: 15px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi .v { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .kpi .d { font-size: 12px; margin-top: 2px; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding-top: 8px; }
  .chart .col { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 1px; height: 100%; min-width: 0; }
  .chart .b { flex: 1; max-width: 18px; border-radius: 4px 4px 0 0; min-height: 0; }
  .chart-x { display: flex; gap: 3px; margin-top: 4px; }
  .chart-x div { flex: 1; text-align: center; font-size: 10px; color: var(--muted); overflow: hidden; white-space: nowrap; min-width: 0; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
  .day-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); padding: 14px 0 4px; border-bottom: 1px solid var(--line); }
  .period-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .period-nav .lbl { flex: 1; text-align: center; font-weight: 700; }
  .period-nav button { background: var(--card); color: var(--brand); border: 1px solid var(--line); padding: 8px 14px; }
  .bar.over > span { background: var(--bad); }
  .goal { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 10px; background: var(--card); }
  .goal .big-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--ok-bg); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
  .goal .bar { height: 10px; margin-top: 10px; }
  .goal.done { border-color: #9fd3b4; background: #f3fbf6; }
  .lock { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
  .lock h1 { margin-top: 8px; }
  .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 22px 0 8px; }
  .pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--brand); }
  .pin-dots span.on { background: var(--brand); }
  .pin-msg { min-height: 20px; font-size: 14px; color: var(--bad); }
  .pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; justify-content: center; margin-top: 14px; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; background: var(--card); color: var(--ink); border: 1px solid var(--line); font-size: 26px; font-weight: 500; }
  .pad button:active { background: var(--ok-bg); }
  .pad button.fn { background: none; border: 0; font-size: 15px; color: var(--brand-2); }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  body.privacy #app, body.privacy #modal { visibility: hidden; }
  .imp-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 8px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .imp-row.off { opacity: .5; }
  .imp-row input[type=checkbox] { width: 22px; height: 22px; margin: 2px 0 0; padding: 0; accent-color: var(--brand); }
  .imp-row select { grid-column: 2 / 4; padding: 8px 10px; font-size: 15px; }
  select.unc { border-color: #e0a64a; background: #fffaf0; }
  .unc-tag { color: #b7791f; }
  .sheet.tall { max-height: 96vh; }
  .sticky-foot { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); background: var(--card); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin-top: 8px; }
  .sticky-foot button.block { margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 500; }
  .bar.warn > span { background: var(--warn); }
  /* крупная сумма, плитки категорий, кнопки-выбор */
  .amt-big input { font-size: 30px; font-weight: 700; text-align: center; padding: 10px 8px; }
  .amt-big select { font-size: 16px; }
  .seg-big button { padding: 11px 4px; font-size: 15px; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .tile { background: var(--bg); color: var(--ink); border: 2px solid transparent; border-radius: 14px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-weight: 500; font-size: 12px; line-height: 1.15; min-height: 76px; }
  .tile .e { font-size: 26px; line-height: 1; }
  .tile > span:last-child { text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .tile.on { border-color: var(--brand-2); background: var(--ok-bg); color: var(--brand); font-weight: 700; }
  .chips.pick { margin-top: 0; }
  .chips.pick .chip { padding: 10px 14px; font-size: 15px; }
  .chips.pick .chip small { color: var(--muted); font-weight: 400; }
  .chips.pick .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chips.pick .chip.on small { color: #cfe5e1; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .quick button { padding: 16px 8px; font-size: 18px; border-radius: 14px; }
  .quick .exp { background: var(--bad-bg); color: var(--bad); }
  .quick .inc { background: var(--ok-bg); color: var(--ok); }
  .qmark { background: rgba(255,255,255,.14); color: #fff; width: 22px; height: 22px; border-radius: 50%; padding: 0; font-size: 13px; margin-left: 6px; vertical-align: 1px; }
  .explain { background: rgba(255,255,255,.1); border-radius: 10px; padding: 8px 10px; font-size: 13px; color: #d6ebe7; margin: 0 0 10px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 24px); background: #14201f; color: #fff; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 15px; }
  .toast button { background: none; color: #8fe0c0; padding: 4px 6px; font-size: 15px; }
  nav button .i { display: block; font-size: 21px; line-height: 1.1; margin-bottom: 2px; }
  nav button { padding: 8px 2px 10px; }
  button.small { padding: 9px 14px; }
  html.big body { zoom: 1.15; }
  .tile .e.letter { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-2); color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
</style>
</head>

function periodRange(kind, anchor, from, to) {

    label = f.getMonth() === t.getMonth() ? `${f.getDate()}–${t.getDate()} ${MONTHS_G[t.getMonth()]} ${t.getFullYear()}` : `${f.getDate()} ${MONTHS_G[f.getMonth()]} – ${t.getDate()} ${MONTHS_G[t.getMonth()]} ${t.getFullYear()}`;
  } else if (kind === "month") {

    label = `${MONTHS[f.getMonth()]} ${f.getFullYear()}`;

    for (let d = parseYmd(from); ymd(d) <= to; d = addDays(d, 1)) {
      const k = ymd(d);

    }
  } else if (len <= 120) {
    for (let d = parseYmd(from); ymd(d) <= to; d = addDays(d, 7)) {
      const e = addDays(d, 6); const k2 = ymd(e) > to ? to : ymd(e);
      out.push({ from: ymd(d), to: k2, label: `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, "0")}` });
    }
  } else {
    const f = parseYmd(from);
    for (let d = new Date(f.getFullYear(), f.getMonth(), 1); ymd(d) <= to; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
      const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      out.push({ from: ymd(d) < from ? from : ymd(d), to: ymd(e) > to ? to : ymd(e), label: MONTHS_S[d.getMonth()] });

// цифровая клавиатура: onDone(pin) вызывается, когда набрано len цифр (или нажато «Готово» при len = 0)
function pinPad({ title, subtitle, len, onDone, extra }) {
  let pin = "";

  const wrap = h("div", {});
  const maxLen = len || 6;

  }
  async function press(d) {

    pin += d; drawDots(); msg.textContent = "";
    if (len && pin.length === len) { const p = pin; await finish(p); }
  }
  async function finish(p) {
    const res = await onDone(p);

    } else if (res && res.reset) { pin = ""; drawDots(); }
  }
  const back = () => { pin = pin.slice(0, -1); drawDots(); };
  const okBtn = !len && h("button", { type: "button", class: "fn", onclick: () => { if (pin.length < 4) { msg.textContent = "Минимум 4 цифры"; return; } finish(pin); } }, "Готово");
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((d) => h("button", { type: "button", onclick: () => press(d) }, d));

  wrap.append(h("h2", {}, title), subtitle && h("p", { class: "muted small-text", style: "margin:6px 0 0" }, subtitle), dots, msg, pad, extra || "");

  // ---------- накопления ----------
  function goalSaved(g) {
    const acc = g.accountId && S.data.accounts.find((a) => a.id === g.accountId);
    if (acc) return convert(acc.balance || 0, acc.currency, g.currency) || 0;
    return g.saved || 0;
  }
  function monthsUntil(date) {
    if (!date) return null;
    const a = parseYmd(today()), b = parseYmd(date);
    if (b <= a) return 0;
    return Math.max(1, (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + (b.getDate() >= a.getDate() ? 0 : -1));
  }
  function goalInfo(g) {
    const saved = goalSaved(g), target = g.target || 0;
    const left = Math.max(0, target - saved);
    const pct = target > 0 ? Math.min(100, saved / target * 100) : 0;
    const months = monthsUntil(g.deadline);
    const perMonth = months ? left / months : null;
    return { saved, target, left, pct, months, perMonth, done: target > 0 && saved >= target };
  }

  // операции за период: из памяти или подгрузка старых
  function txRange(from, to) {
    if (from >= TX_FROM) return S.tx.filter((t) => t.date >= from && t.date <= to);
    const key = from + "_" + to;
    const c = S.archive[key];
    if (c && c.list) return c.list;
    if (!c) {
      S.archive[key] = { loading: true };
      F.getDocs(F.query(F.collection(db, "users", S.viewUid, "transactions"), F.where("date", ">=", from), F.where("date", "<=", to)))
        .then((q) => { S.archive[key] = { list: q.docs.map((d) => ({ id: d.id, ...d.data() })) }; render(); })
        .catch((e) => { S.archive[key] = { list: [], err: errText(e) }; render(); });
    }
    return null;
  }
  function sumTx(list, type) { return sum(list.filter((t) => t.type === type).map((t) => toBase(t.amount, t.currency) || 0)); }
  function byCategory(list, type) {
    const m = {};
    for (const t of list) if (t.type === type) m[t.category || "Без категории"] = (m[t.category || "Без категории"] || 0) + (toBase(t.amount, t.currency) || 0);
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }

    if (S.merchants && S.merchants.uid === S.viewUid) return S.merchants.map;
    let map = {};
    try { const d = await F.getDoc(merchRef()); if (d.exists()) map = (d.data() || {}).map || {}; } catch (e) { /* без подсказок */ }
    S.merchants = { uid: S.viewUid, map };
    return map;
  }
  // запоминаем: этот продавец → эта категория
  async function learnMerchants(pairs) {
    const map = await loadMerchants();
    let changed = false;
    for (const [k, c, t] of pairs) { if (!k || !c || k.length > 120) continue; if (!map[k] || map[k].c !== c || map[k].t !== t) { map[k] = { c, t }; changed = true; } }
    if (!changed) return;
    try { await F.setDoc(merchRef(), { map, updatedAt: F.serverTimestamp() }); } catch (e) { /* не страшно */ }
  }

          totMonthly > 0 && h("div", { class: "small-text", style: "margin-top:8px;color:var(--brand-2)" }, `Чтобы успеть к срокам, откладывайте ≈ ${fmtMoney(totMonthly, base, 0)} в месяц`)),
        goals.map(goalCard),
        h("p", { class: "muted small-text", style: "margin-top:14px" }, "Цели, привязанные к счёту, уже входят в капитал через этот счёт. Цели без счёта — это отметка, сколько из ваших денег отложено, в капитал отдельно не добавляются.")
      ] : h("div", { class: "card" },
        h("h2", { style: "margin-bottom:6px" }, "На что копите?"),
        h("p", { class: "muted small-text", style: "margin:0" }, "Создайте цель — приложение покажет прогресс и сколько откладывать в месяц, чтобы успеть к сроку."),
        chips)
    ];
  }

  function goalsHomeCard() {
    if (!S.loaded.goals || !S.data.goals.length) return null;
    const base = baseCur();
    const goals = S.data.goals.map((g) => ({ g, i: goalInfo(g) })).sort((a, b) => a.i.done - b.i.done || b.i.pct - a.i.pct).slice(0, 3);
    const totSaved = sum(S.data.goals.map((g) => convert(goalSaved(g), g.currency, base) || 0));
    return h("div", { class: "card tap", onclick: () => { S.tab = "capital"; S.capTab = "goals"; render(); window.scrollTo(0, 0); } },
      h("div", { class: "card-head" }, h("h2", {}, "Накопления"), h("span", { class: "num" }, fmtMoney(totSaved, base, 0))),
      goals.map(({ g, i }) => h("div", { style: "margin-top:8px" },
        h("div", { class: "row small-text" }, h("span", {}, (GOAL_CATS[g.category] || GOAL_CATS.other)[1]), h("div", { class: "grow ellipsis" }, g.name), h("span", { class: "num" }, Math.round(i.pct) + "%")),
        h("div", { class: "bar" }, h("span", { style: `width:${Math.max(2, i.pct)}%;${i.done ? "background:var(--ok)" : ""}` })))));
  }

  function viewCapital() {
    return [
      h("div", { class: "seg" }, [["assets", "Активы"], ["debts", "Долги"], ["goals", "Накопления"]].map(([k, t]) => h("button", { class: S.capTab === k ? "on" : "", onclick: () => { S.capTab = k; render(); } }, t))),
      S.capTab === "debts" ? viewDebts() : S.capTab === "goals" ? viewGoals() : viewAssets()
    ];
  }
  function viewMore() {
    if (!S.isAdmin) return viewProfile();
    return [
      h("div", { class: "seg" }, [["profile", "Профиль"], ["users", "Пользователи"]].map(([k, t]) => h("button", { class: S.moreTab === k ? "on" : "", onclick: () => { S.moreTab = k; S.msg = null; render(); } }, t))),
      S.moreTab === "users" ? viewUsers() : viewProfile()
    ];
  }

  function ratesCard() {
    const base = baseCur();
    const r = S.rates && S.rates.rates;
    if (!r) return h("div", { class: "card muted small-text" }, "Курсы валют загружаются…");
    const shown = ["USD", "EUR", "CNY", "RUB", "AED"].filter((c) => c !== base && r[c] && r[base]);
    const k = S.rates.kase;
    return h("div", { class: "card" },
      h("div", { class: "card-head" }, h("h2", {}, k ? "Курсы KASE" : "Курсы"), h("span", { class: "muted small-text" }, "на " + fmtDay(S.rates.date))),
      k && h("p", { class: "muted small-text", style: "margin:0 0 6px" }, "Средневзвешенный курс биржевых торгов"),
      shown.map((c) => h("div", { class: "row small-text" }, h("div", { class: "grow" }, `1 ${c}`), h("div", { class: "num" }, fmtMoney(r[base] / r[c], base, 2)))));
  }

  function itemRow(section, it, title, sub, amount, cur) {
    const base = baseCur();
    const conv = cur !== base ? toBase(amount, cur) : null;
    return h("div", { class: "item tap", onclick: () => openForm(section, it) },
      h("div", { class: "row" },
        h("div", { class: "grow" }, h("div", { class: "ellipsis", style: "font-weight:600" }, title), sub && h("div", { class: "muted small-text ellipsis" }, sub)),
        h("div", { class: "amt" }, h("div", { class: "num" + (section === "liabilities" ? " neg" : "") }, fmtMoney(amount, cur)),
          conv != null && h("div", { class: "muted small-text num" }, "≈ " + fmtMoney(conv, base, 0)))));
  }

  function viewAssets() {
    const wait = loadingOrError();
    if (wait) return wait;
    const base = baseCur();
    const t = totals();
    const accs = S.data.accounts;
    const groups = Object.keys(ASSET_CATS).map((k) => [k, S.data.assets.filter((a) => (a.category || "other") === k)]).filter((g) => g[1].length);

    const assetSub = (a) => {
      const bits = [];
      if (a.category === "animals") { if (a.kind) bits.push(a.kind); if (a.count) bits.push(`${fmtNum(a.count)} гол.`); if (a.unitValue) bits.push(`по ${fmtMoney(a.unitValue, a.currency)}`); }
      if (a.category === "realty") { if (a.area) bits.push(`${fmtNum(a.area)} м²`); if (a.rooms) bits.push(`${a.rooms}-комн.`); if (a.address) bits.push(a.address); }
      if (a.category === "securities") {
        const lp = livePrice(a);
        if (a.secType) bits.push(SEC_TYPES[a.secType] || ""); if (a.ticker) bits.push(a.ticker); if (a.qty) bits.push(`${fmtNum(a.qty)} шт.`);
        if (lp) bits.push(`📈 ${fmtMoney(lp.price, lp.currency)} (${lp.market === "KASE" ? "KASE" : "биржа"}, ${fmtDay(lp.date)})`);
        else { if (a.price) bits.push(`по ${fmtMoney(a.price, a.currency)}`); if (secMarket(a)) bits.push("⏳ цена с биржи появится после обновления"); }
        if (a.broker) bits.push(a.broker);
      }
      if (a.category === "land" && a.address) bits.push(a.address);
      if (a.category === "car" && a.plate) bits.push(a.plate);
      if (a.category === "receivable") { if (a.debtor) bits.push(a.debtor); if (a.dueDate) bits.push("до " + fmtDay(a.dueDate)); }
      if (a.purchaseValue && a.category !== "receivable") {
        const diff = assetValue(a) - a.purchaseValue;
        if (diff) bits.push((diff > 0 ? "+" : "") + fmtMoney(diff, a.currency, 0) + " к покупке");
      }
      return bits.join(" · ");
    };

    return [
      h("h1", {}, "Активы"),
      h("p", { class: "muted" }, "Всего: ", h("b", { class: "num" }, fmtMoney(t.assets, base, 0))),
      ratesNote(t),
      h("div", { class: "card" },
        h("div", { class: "card-head" }, h("h2", {}, "Деньги"), h("button", { class: "add", onclick: () => openForm("accounts") }, "+ Добавить")),
        accs.length ? accs.map((a) => itemRow("accounts", a, a.name, [ACCOUNT_TYPES[a.type] || "", a.type === "deposit" && a.rate ? `${fmtNum(a.rate)}%` : ""].filter(Boolean).join(" · "), a.balance, a.currency))
          : h("div", { class: "empty" }, "Карты, наличные, депозиты"),
        accs.length > 1 && h("div", { class: "row", style: "border-top:1px solid var(--line);padding-top:10px;margin-top:4px" },
          h("div", { class: "grow muted" }, "Итого"), h("b", { class: "num" }, fmtMoney(t.money, base, 0)))),
      h("div", { class: "card" },
        h("div", { class: "card-head" }, h("h2", {}, "Имущество"), h("button", { class: "add", onclick: () => openForm("assets") }, "+ Добавить")),
        groups.length ? groups.map(([k, list]) => [
          h("div", { class: "row group-title" }, h("div", { class: "grow" }, ASSET_CATS[k]), h("div", { class: "num" }, fmtMoney(t.byCat[k] || 0, base, 0))),
          list.map((a) => itemRow("assets", a, a.name, assetSub(a), assetValue(a), a.currency))
        ]) : h("div", { class: "empty" }, "Недвижимость, транспорт, животные, ценные бумаги, вложения, долги вам"))
    ];
  }

  function viewDebts() {
    const wait = loadingOrError();
    if (wait) return wait;
    const base = baseCur();
    const t = totals();
    const list = S.data.liabilities;
    const sub = (l) => {
      const bits = [LIAB_KINDS[l.kind] || ""];
      if (l.lender) bits.push(l.lender);
      if (l.monthlyPayment) bits.push(`${fmtMoney(l.monthlyPayment, l.currency)}/мес`);
      if (l.paymentDay) bits.push(`${l.paymentDay}-го числа`);
      if (l.rate) bits.push(`${fmtNum(l.rate)}%`);
      if (l.endDate) bits.push("до " + fmtDay(l.endDate));
      return bits.filter(Boolean).join(" · ");
    };
    return [
      h("h1", {}, "Долги"),
      h("p", { class: "muted" }, "Всего: ", h("b", { class: "num neg" }, fmtMoney(t.debt, base, 0)), " · в месяц: ", h("b", { class: "num" }, fmtMoney(t.monthly, base, 0))),
      ratesNote(t),
      h("div", { class: "card" },
        h("div", { class: "card-head" }, h("h2", {}, "Кредиты и долги"), h("button", { class: "add", onclick: () => openForm("liabilities") }, "+ Добавить")),
        list.length ? list.map((l) => {
          const row = itemRow("liabilities", l, l.name, sub(l), l.balance, l.currency);
          if (l.initialAmount && l.initialAmount > 0 && l.balance != null) {
            const paid = Math.min(100, Math.max(0, (1 - l.balance / l.initialAmount) * 100));
            row.append(h("div", { class: "bar" }, h("span", { style: `width:${paid}%;background:var(--ok)` })),
              h("div", { class: "muted small-text" }, `Погашено ${Math.round(paid)}%`));
          }
          return row;
        }) : h("div", { class: "empty" }, "Ипотека, кредиты, рассрочки, долги людям"))
    ];
  }

  function viewProfile() {
    const p = S.profile;
    const name = h("input", { type: "text", value: p.name || "" });
    const cur = h("select", {}, CURRENCIES.map(([c, t]) => h("option", { value: c, selected: c === (p.baseCurrency || "KZT") }, `${c} · ${t}`)));
    async function save(ev) {
      ev.preventDefault();
      try {
        await F.updateDoc(F.doc(db, "users", S.user.uid), { name: name.value.trim() || p.name, baseCurrency: cur.value });
        S.msg = { cls: "note", text: "Сохранено." };
      } catch (e) { S.msg = { cls: "err", text: errText(e) }; }
      render();
    }
    const rbox = h("div", {});
    async function refreshRates(ev) {
      const b = ev.currentTarget; b.disabled = true; b.textContent = "Обновляю…";
      const r = await loadAllRates(true);
      if (r) { S.rates = r; S.msg = { cls: "note", text: `Курсы обновлены на ${fmtDay(r.date)}.` }; }
      else S.msg = { cls: "err", text: "Не удалось загрузить курсы. Проверьте интернет." };
      render();
    }
    return [
      h("h1", {}, "Профиль"), h("p", { class: "muted" }, p.email),
      S.msg && h("div", { class: S.msg.cls, style: "margin:0 0 12px" }, S.msg.text),
      h("form", { class: "card", onsubmit: save },
        h("label", { style: "margin-top:0" }, "Имя"), name,
        h("label", {}, "Основная валюта (в ней считаются итоги)"), cur,
        h("button", { class: "block", type: "submit" }, "Сохранить")),
      h("div", { class: "card" },
        h("div", { class: "card-head" }, h("h2", {}, "Курсы валют"), S.rates && h("span", { class: "muted small-text" }, "на " + fmtDay(S.rates.date))),
        h("p", { class: "muted small-text" }, "Тенге к доллару, евро, рублю, юаню и дирхаму — средневзвешенные курсы KASE, обновляются каждые 30 минут в торговые часы. Остальные валюты пересчитываются по рыночным данным."),
        h("button", { class: "ghost block", style: "margin-top:4px", onclick: refreshRates }, "Обновить сейчас"), rbox),
      pinCard(),
      h("div", { class: "card" },
        h("div", { class: "card-head" }, h("h2", {}, "Удобство"), h("span", { class: "badge " + (localStorage.getItem("mf_big") === "1" ? "active" : "pending") }, localStorage.getItem("mf_big") === "1" ? "крупный текст" : "обычный текст")),
        h("p", { class: "muted small-text" }, "Крупный текст и кнопки — удобнее читать и легче попадать пальцем. Настройка действует на этом телефоне."),
        h("button", { class: "ghost block", style: "margin-top:4px", onclick: () => { try { localStorage.setItem("mf_big", localStorage.getItem("mf_big") === "1" ? "0" : "1"); } catch (e) {} applyBig(); render(); } },
          localStorage.getItem("mf_big") === "1" ? "Сделать текст обычным" : "🔍 Сделать текст крупнее")),
      h("div", { class: "card" }, uidBlock()),
      h("button", { class: "ghost block", onclick: () => A.signOut(auth) }, "Выйти")
    ];
  }

  function viewUsers() {
    const nameOf = (id) => { const u = S.users.find((x) => x.id === id); return u ? (u.name || u.email) : id; };
    async function setStatus(u, status) {
      if (status === "blocked" && !confirmInline(u)) return;
      try {
        await F.updateDoc(F.doc(db, "users", u.id), { status });
        await F.addDoc(F.collection(db, "audit"), { by: S.user.uid, target: u.id, action: "status", from: u.status || null, to: status, at: F.serverTimestamp() });
        S.msg = null;
      } catch (e) { S.msg = { cls: "err", text: errText(e) }; render(); }
    }
    function confirmInline(u) {
      if (S.armed === u.id) { S.armed = null; return true; }
      S.armed = u.id;
      S.msg = { cls: "err", text: `Нажмите «Отключить» ещё раз, чтобы закрыть доступ: ${u.name || u.email}` };
      render();
      return false;
    }
    const link = location.origin + location.pathname;
    const copyBtn = h("button", { class: "ghost small", onclick: async () => {
      try { await navigator.clipboard.writeText(link); copyBtn.textContent = "Скопировано"; } catch (e) { copyBtn.textContent = "Скопируйте вручную"; }
    } }, "Копировать");

    const item = (u) => {
      const me = u.id === S.user.uid;
      const st = u.status || "pending";
      const viewing = S.viewUid === u.id;
      return h("div", { class: "item" },
        h("div", { class: "row" },
          h("div", { class: "grow" },
            h("div", { class: "ellipsis", style: "font-weight:600" }, u.name || "Без имени"),
            h("div", { class: "muted ellipsis small-text" }, u.email || "")),
          me ? h("span", { class: "badge admin" }, "Вы") : h("span", { class: "badge " + st }, STATUS[st] || st)),
        h("div", { class: "row", style: "margin-top:8px;flex-wrap:wrap" },
          h("button", { class: "small" + (viewing ? " ghost" : ""), disabled: viewing, onclick: () => { openBudget(u.id); S.tab = "home"; render(); window.scrollTo(0, 0); } }, viewing ? "Открыт" : "Открыть бюджет"),
          !me && st !== "active" && h("button", { class: "small ghost", onclick: () => setStatus(u, "active") }, st === "blocked" ? "Включить" : "Одобрить"),
          !me && st !== "blocked" && h("button", { class: "small danger-ghost", onclick: () => setStatus(u, "blocked") }, "Отключить")));
    };
    const auditText = (a) => {
      if (a.action === "edit") {
        const op = a.op === "create" ? "добавил" : a.op === "delete" ? "удалил" : "изменил";
        return `${op} ${SECTION_NAMES[a.section] || "запись"} «${a.name || "—"}» у ${nameOf(a.target)}`;
      }
      return `${nameOf(a.target)}: ${STATUS[a.from] || "—"} → ${STATUS[a.to] || a.to}`;
    };
    return [
      h("h1", {}, "Пользователи"), h("p", { class: "muted" }, `Всего: ${S.users.length}`),
      h("div", { class: "card" },
        h("h2", { style: "margin-bottom:6px" }, "Пригласить"),
        h("p", { class: "muted small-text" }, "Отправьте человеку эту ссылку. После регистрации он появится в списке, и вы его одобрите."),
        h("div", { class: "row" }, h("div", { class: "code grow" }, link), copyBtn)),
      S.msg && h("div", { class: S.msg.cls, style: "margin-bottom:12px" }, S.msg.text),
      h("div", { class: "card" }, S.users.length ? S.users.map(item) : h("p", { class: "muted" }, "Пока никого нет.")),
      h("div", { class: "card" },
        h("h2", { style: "margin-bottom:6px" }, "Журнал действий"),
        S.audit.length ? S.audit.map((a) => h("div", { class: "item" },
          h("div", { class: "small-text" }, auditText(a)),
          h("div", { class: "muted small-text" }, `${fmtDate(a.at)} · ${nameOf(a.by)}`))) : h("p", { class: "muted" }, "Записей пока нет."))
    ];
  }
}
</script>
</body>
</html>
